<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phuntshok's Accounting System</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">

    <!-- LOGIN SCREEN -->
    <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-200">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Phuntshok's Accounting</h1>
                <p class="text-slate-500 text-sm mt-1">Retail Accounting System</p>
            </div>

            <div id="loginError" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200">
                Invalid email or password.
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" value="admin@phuntshok.com" required 
                           class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                    <input type="password" id="loginPassword" value="admin123" required 
                           class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors text-sm shadow-sm">
                    Sign In
                </button>
            </form>

            <div class="mt-4 text-center text-xs text-slate-400">
                Demo Credentials: <span class="font-mono text-slate-600">admin@phuntshok.com / admin123</span>
            </div>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appView" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- SIDEBAR -->
        <aside class="sidebar bg-slate-900 text-slate-300 w-full md:w-64 flex-shrink-0 flex flex-col justify-between">
            <div>
                <!-- Brand Header -->
                <div class="p-4 border-b border-slate-800 flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-lg">P</div>
                    <div>
                        <div class="font-bold text-white leading-tight">Phuntshok's</div>
                        <div class="text-xs text-slate-400">Retail Accounting</div>
                    </div>
                </div>

                <!-- Navigation Links -->
                <nav id="mainNavigation" class="p-3 space-y-1 text-sm">
                    <button type="button" class="nav-item active" data-page="dashboard">
                        🏠 <span>Dashboard</span>
                    </button>

                    <div class="nav-title">MASTERS</div>
                    <button type="button" class="nav-item" data-page="accounts">📚 <span>Chart of Accounts</span></button>
                    <button type="button" class="nav-item" data-page="customers">👥 <span>Customers</span></button>
                    <button type="button" class="nav-item" data-page="suppliers">🏢 <span>Suppliers</span></button>
                    <button type="button" class="nav-item" data-page="products">📦 <span>Products & Inventory</span></button>

                    <div class="nav-title">TRANSACTIONS</div>
                    <button type="button" class="nav-item" data-page="sales">🧾 <span>Sales Invoices</span></button>
                    <button type="button" class="nav-item" data-page="purchases">🛒 <span>Purchase Invoices</span></button>
                    <button type="button" class="nav-item" data-page="receipts">💵 <span>Receipts</span></button>
                    <button type="button" class="nav-item" data-page="payments">💸 <span>Payments</span></button>

                    <div class="nav-title">REPORTS</div>
                    <button type="button" class="nav-item" data-page="ledger">📖 <span>General Ledger</span></button>
                    <button type="button" class="nav-item" data-page="trial">⚖️ <span>Trial Balance</span></button>
                    <button type="button" class="nav-item" data-page="profit-loss">📈 <span>Profit & Loss</span></button>
                    <button type="button" class="nav-item" data-page="balance-sheet">🏦 <span>Balance Sheet</span></button>
                </nav>
            </div>

            <!-- Sidebar User Profile & Sign Out -->
            <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                <div>
                    <div id="sidebarUserName" class="text-xs font-semibold text-white">Admin User</div>
                    <div id="sidebarUserEmail" class="text-[10px] text-slate-400">admin@phuntshok.com</div>
                </div>
                <button type="button" id="sidebarLogoutBtn" class="text-slate-400 hover:text-red-400 text-xs font-medium px-2 py-1 rounded border border-slate-700 hover:border-red-500 transition-colors">
                    Log Out
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col min-w-0">
            <!-- TOP BAR -->
            <header class="bg-white border-b px-6 py-4 flex items-center justify-between shadow-sm">
                <div>
                    <h1 id="pageTitle" class="text-xl font-bold text-slate-900">Dashboard</h1>
                    <p id="pageSubtitle" class="text-xs text-slate-500">Overview of your accounting system</p>
                </div>

                <div class="flex items-center space-x-3">
                    <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full border border-indigo-100">Live Demo</span>
                    <button type="button" id="headerLogoutBtn" class="bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-600 text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-200 transition-colors">
                        Sign Out
                    </button>
                </div>
            </header>

            <!-- DYNAMIC CONTENT CONTAINER -->
            <div id="content" class="p-6 flex-1 overflow-y-auto">
                <!-- Javascript populates content dynamically -->
            </div>
        </main>
    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
