</head>

    <!-- MAIN WRAPPER -->

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

        <!-- CONTENT VIEW -->

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">

    <!-- APPLICATION LOGIC & STORAGE -->
    <script>
        // Core State Definition & Initial Sample Dataset
        const sampleState = {
            settings: {
                companyName: "Phuntshok Retail & Trading",

                currency: "Nu.",
                currencyCode: "BTN",
                taxRate: 5.0, // 5% Sales Tax
                address: "Norzin Lam, Thimphu, Bhutan"
            },
            accounts: [
                { code: '1010', name: 'Cash on Hand', type: 'Asset', category: 'Current Asset', balance: 45000 },
                { code: '1020', name: 'BNB Bank Account', type: 'Asset', category: 'Current Asset', balance: 185000 },
                { code: '1100', name: 'Accounts Receivable', type: 'Asset', category: 'Current Asset', balance: 35000 },
                { code: '1200', name: 'Inventory Asset', type: 'Asset', category: 'Current Asset', balance: 42000 },
                { code: '1500', name: 'Store Furniture & Fixtures', type: 'Asset', category: 'Fixed Asset', balance: 120000 },

                { code: '3010', name: 'Owner Capital', type: 'Equity', category: 'Equity', balance: 350000 },
                { code: '3020', name: 'Retained Earnings', type: 'Equity', category: 'Equity', balance: 30000 },
                { code: '4010', name: 'Retail Sales Income', type: 'Revenue', category: 'Operating Income', balance: 52000 },
                { code: '5010', name: 'Cost of Goods Sold (COGS)', type: 'Expense', category: 'Cost of Sales', balance: 24000 },
                { code: '5020', name: 'Store Rent Expense', type: 'Expense', category: 'Operating Expense', balance: 15000 },
                { code: '5030', name: 'Electricity & Utilities', type: 'Expense', category: 'Operating Expense', balance: 3650 }
            ],
            customers: [
                { id: 'CUST-101', name: 'Tashi Commercial Ltd', contact: 'Tashi Dorji', phone: '+975-17112233', email: 'tashi@commercial.bt', balance: 20000 },
                { id: 'CUST-102', name: 'Karma Stationery Shop', contact: 'Karma Wangmo', phone: '+975-17556677', email: 'karma@stationery.bt', balance: 15000 }
            ],
            suppliers: [
                { id: 'SUPP-201', name: 'Himalayan Traders Pvt', contact: 'Pema Rinzin', phone: '+975-02334455', email: 'orders@himalayan.bt', balance: 18500 }
            ],
            products: [
                { id: 'PROD-01', code: 'TEA-01', name: 'Bhutan Organic Green Tea (250g)', category: 'Beverages', price: 350, cost: 200, stock: 65, minStock: 15 },
                { id: 'PROD-02', code: 'CRAFT-02', name: 'Handcrafted Wooden Cup (Dapa)', category: 'Crafts', price: 1200, cost: 700, stock: 8, minStock: 10 },
                { id: 'PROD-03', code: 'HONEY-03', name: 'Bumthang Natural Honey (500ml)', category: 'Food', price: 650, cost: 400, stock: 24, minStock: 5 }
            ],
            salesInvoices: [
                { id: 'INV-1001', customerId: 'CUST-101', date: '2026-09-20', items: [{ productId: 'PROD-01', qty: 20, price: 350, total: 7000 }], subtotal: 7000, tax: 350, total: 7350, status: 'Unpaid' },
                { id: 'INV-1002', customerId: 'CUST-102', date: '2026-09-22', items: [{ productId: 'PROD-02', qty: 10, price: 1200, total: 12000 }], subtotal: 12000, tax: 600, total: 12600, status: 'Paid' }
            ],
            purchaseBills: [
                { id: 'BILL-5001', supplierId: 'SUPP-201', date: '2026-09-15', items: [{ productId: 'PROD-01', qty: 50, cost: 200, total: 10000 }], total: 10000, status: 'Pending' }
            ],
            receipts: [
                { id: 'REC-301', customerId: 'CUST-102', amount: 12600, date: '2026-09-23', method: 'BNB Bank Transfer', ref: 'TXN-99812' }
            ],
            payments: [
                { id: 'PAY-401', supplierId: 'SUPP-201', amount: 5000, date: '2026-09-18', method: 'BNB Bank Transfer', ref: 'TXN-11029' }
            ],
            journalEntries: [
                { id: 'JRN-001', date: '2026-09-01', desc: 'Capital infusion by Owner', debitCode: '1020', creditCode: '3010', amount: 350000 },
                { id: 'JRN-002', date: '2026-09-05', desc: 'Paid monthly store rent', debitCode: '5020', creditCode: '1020', amount: 15000 }
            ],
            users: [
                { name: 'Phuntshok Admin', email: 'admin@phuntshok.com', role: 'Administrator', status: 'Active' },
                { name: 'Sonam Norbu', email: 'sonam@phuntshok.com', role: 'Accountant', status: 'Active' }
            ]
        };

        // State Manager
        let appState = loadState();

        function loadState() {
            const stored = localStorage.getItem('phuntshok_suite_db');
            if (stored) {
                try { return JSON.parse(stored); } catch (e) { console.error("Error reading localStorage", e); }
            }
            return JSON.parse(JSON.stringify(sampleState));
        }

        function saveState() {
            localStorage.setItem('phuntshok_suite_db', JSON.stringify(appState));
        }

        function resetToSampleData() {
            if (confirm("Reset all financial records back to initial sample state? Any new transactions will be lost.")) {
                appState = JSON.parse(JSON.stringify(sampleState));
                saveState();
                navigateTo(currentPage);
            }
        }

        function handleLogout() {
            if (confirm("Are you sure you want to sign out of Phuntshok Accounting Suite?")) {
                alert("Session closed safely. Click OK to reload.");
                location.reload();
            }
        }

        // Active Navigation Page
        let currentPage = 'dashboard';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarBackdrop').classList.toggle('hidden');
        }

        // Currency Formatting Helper
        function fmt(amount) {
            const symbol = appState.settings.currency || 'Nu.';
            const num = Number(amount || 0);
            return `${symbol} ${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // Post Journal / Ledger Transaction Engine
        function postDoubleEntry(date, desc, debitCode, creditCode, amount) {
            const id = 'JRN-' + String(appState.journalEntries.length + 1).padStart(3, '0');
            
            // Add to Journal Entries
            appState.journalEntries.unshift({ id, date, desc, debitCode, creditCode, amount });

            // Post to Account Balances
            const debitAcc = appState.accounts.find(a => a.code === debitCode);
            const creditAcc = appState.accounts.find(a => a.code === creditCode);

            if (debitAcc) {
                if (['Asset', 'Expense'].includes(debitAcc.type)) debitAcc.balance += amount;
                else debitAcc.balance -= amount;
            }

            if (creditAcc) {
                if (['Liability', 'Equity', 'Revenue'].includes(creditAcc.type)) creditAcc.balance += amount;
                else creditAcc.balance -= amount;
            }

            saveState();
        }

        // Router & View Switcher
        function navigateTo(pageId) {
            currentPage = pageId;

            // Highlight active button
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-page') === pageId) {
                    btn.className = "nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold bg-emerald-600 text-white shadow-md shadow-emerald-900/30";
                } else {
                    btn.className = "nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-white";
                }
            });

            // Set Page Title Header
            const titleMap = {
                'dashboard': ['Dashboard Overview', 'Real-time financial performance and KPI metrics'],
                'accounts': ['Chart of Accounts', 'Master double-entry ledger accounts hierarchy'],
                'customers': ['Customer Directory', 'Client billing accounts and aging receivables'],
                'suppliers': ['Suppliers & Vendors', 'Vendor relations and accounts payable'],
                'products': ['Products & Inventory', 'Stock tracking, reorder alerts, and item margins'],
                'sales': ['Sales Invoices', 'Customer sales billing and invoicing'],
                'purchases': ['Purchase Orders & Bills', 'Vendor bills and incoming inventory log'],
                'receipts': ['Customer Receipts', 'Log incoming invoice payments from clients'],
                'payments': ['Supplier Payments', 'Disbursements and vendor bill payments'],
                'journal': ['General Journal', 'Double-entry manual journal transactions'],
                'ledger': ['General Ledger', 'Chronological transaction history per account'],
                'trial': ['Trial Balance', 'Audit equality of total debits and credits'],
                'profit-loss': ['Profit & Loss Statement', 'Income statement measuring sales and expenses'],
                'balance-sheet': ['Balance Sheet Statement', 'Assets, Liabilities, and Equity verification'],
                'settings': ['Company & Tax Settings', 'System configuration, currency, and tax setup'],
                'users': ['Users & Permissions', 'Manage system access roles']
            };

            const [title, subtitle] = titleMap[pageId] || ['Accounting Suite', 'Phuntshok Retail'];
            document.getElementById('pageTitle').innerText = title;
            document.getElementById('pageSubtitle').innerText = subtitle;
            document.getElementById('headerCurrencyBadge').innerText = `${appState.settings.currency} (${appState.settings.currencyCode})`;

            renderPage(pageId);

            // Close mobile menu
            if (window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebarBackdrop').classList.add('hidden');
            }
        }

        // View Generator
        function renderPage(pageId) {
            const container = document.getElementById('mainContent');

            switch(pageId) {
                case 'dashboard':
                    const totalRev = appState.accounts.filter(a => a.type === 'Revenue').reduce((s, a) => s + a.balance, 0);
                    const totalExp = appState.accounts.filter(a => a.type === 'Expense').reduce((s, a) => s + a.balance, 0);
                    const netProfit = totalRev - totalExp;
                    const totalReceivables = appState.customers.reduce((s, c) => s + c.balance, 0);
                    const totalPayables = appState.suppliers.reduce((s, v) => s + v.balance, 0);
                    const lowStockItems = appState.products.filter(p => p.stock <= p.minStock);

                    container.innerHTML = `
                        <!-- KPI Metric Cards Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">

        // Form Event Submit Handlers
        function handleCreateCustomer(e) {
            e.preventDefault();
            const name = document.getElementById('mCustName').value;
            const contact = document.getElementById('mCustContact').value;
            const phone = document.getElementById('mCustPhone').value;
            const email = document.getElementById('mCustEmail').value;

            saveState();
            closeModal();

        }

        function handleCreateSupplier(e) {
            e.preventDefault();
            const name = document.getElementById('mSuppName').value;
            const contact = document.getElementById('mSuppContact').value;
            const phone = document.getElementById('mSuppPhone').value;
            const email = document.getElementById('mSuppEmail').value;
            const id = 'SUPP-' + (201 + appState.suppliers.length);

            appState.suppliers.push({ id, name, contact, phone, email, balance: 0 });
            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleCreateProduct(e) {
            e.preventDefault();
            const code = document.getElementById('mProdCode').value;
            const category = document.getElementById('mProdCat').value;
            const name = document.getElementById('mProdName').value;
            const price = parseFloat(document.getElementById('mProdPrice').value) || 0;
            const cost = parseFloat(document.getElementById('mProdCost').value) || 0;
            const stock = parseInt(document.getElementById('mProdStock').value) || 0;
            const id = 'PROD-0' + (appState.products.length + 1);

            appState.products.push({ id, code, name, category, price, cost, stock, minStock: 5 });
            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleCreateSale(e) {
            e.preventDefault();
            const custId = document.getElementById('mSaleCust').value;
            const prodId = document.getElementById('mSaleProd').value;
            const qty = parseInt(document.getElementById('mSaleQty').value) || 1;
            const date = document.getElementById('mSaleDate').value;

            const product = appState.products.find(p => p.id === prodId);
            const customer = appState.customers.find(c => c.id === custId);
            if (!product || !customer) return;

            const subtotal = product.price * qty;
            const tax = subtotal * (appState.settings.taxRate / 100);
            const total = subtotal + tax;

            const invId = 'INV-' + (1001 + appState.salesInvoices.length);

            // Record Sales Invoice
            appState.salesInvoices.unshift({ id: invId, customerId: custId, date, items: [{ productId: prodId, qty, price: product.price, total: subtotal }], subtotal, tax, total, status: 'Unpaid' });

            // Update Customer Balance
            customer.balance += total;

            // Reduce Product Inventory Stock
            product.stock = Math.max(0, product.stock - qty);

            // Double Entry Post: Debit Accounts Receivable (1100), Credit Retail Sales Income (4010)
            postDoubleEntry(date, `Sales Invoice ${invId} to ${customer.name}`, '1100', '4010', subtotal);

            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleCreatePurchase(e) {
            e.preventDefault();
            const suppId = document.getElementById('mPurSupp').value;
            const prodId = document.getElementById('mPurProd').value;
            const qty = parseInt(document.getElementById('mPurQty').value) || 1;
            const date = document.getElementById('mPurDate').value;

            const product = appState.products.find(p => p.id === prodId);
            const supplier = appState.suppliers.find(s => s.id === suppId);
            if (!product || !supplier) return;

            const total = product.cost * qty;
            const billId = 'BILL-' + (5001 + appState.purchaseBills.length);

            // Add Bill Record
            appState.purchaseBills.unshift({ id: billId, supplierId: suppId, date, items: [{ productId: prodId, qty, cost: product.cost, total }], total, status: 'Pending' });

            // Increase Supplier Balance
            supplier.balance += total;

            // Restock Product Quantity
            product.stock += qty;

            // Double Entry Post: Debit Inventory Asset (1200), Credit Accounts Payable (2010)
            postDoubleEntry(date, `Vendor Bill ${billId} from ${supplier.name}`, '1200', '2010', total);

            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleCreateReceipt(e) {
            e.preventDefault();
            const custId = document.getElementById('mRecCust').value;
            const method = document.getElementById('mRecMethod').value;
            const amount = parseFloat(document.getElementById('mRecAmount').value) || 0;
            const date = new Date().toISOString().split('T')[0];

            const customer = appState.customers.find(c => c.id === custId);
            if (!customer) return;

            const recId = 'REC-' + (301 + appState.receipts.length);
            appState.receipts.unshift({ id: recId, customerId: custId, amount, date, method, ref: 'TXN-' + Math.floor(10000 + Math.random() * 90000) });

            // Reduce Customer Receivable
            customer.balance = Math.max(0, customer.balance - amount);

            // Double Entry Post: Debit Cash/Bank (1020), Credit Accounts Receivable (1100)
            const debitAccountCode = method.includes('Cash') ? '1010' : '1020';
            postDoubleEntry(date, `Payment received from ${customer.name}`, debitAccountCode, '1100', amount);

            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleCreatePayment(e) {
            e.preventDefault();
            const suppId = document.getElementById('mPaySupp').value;
            const method = document.getElementById('mPayMethod').value;
            const amount = parseFloat(document.getElementById('mPayAmount').value) || 0;
            const date = new Date().toISOString().split('T')[0];

            const supplier = appState.suppliers.find(s => s.id === suppId);
            if (!supplier) return;

            const payId = 'PAY-' + (401 + appState.payments.length);
            appState.payments.unshift({ id: payId, supplierId: suppId, amount, date, method, ref: 'TXN-' + Math.floor(10000 + Math.random() * 90000) });

            // Reduce Supplier Owed
            supplier.balance = Math.max(0, supplier.balance - amount);

            // Double Entry Post: Debit Accounts Payable (2010), Credit Cash/Bank
            const creditAccountCode = method.includes('Cash') ? '1010' : '1020';
            postDoubleEntry(date, `Payment to vendor ${supplier.name}`, '2010', creditAccountCode, amount);

            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleCreateJournal(e) {
            e.preventDefault();
            const desc = document.getElementById('mJrnDesc').value;
            const debitCode = document.getElementById('mJrnDebit').value;
            const creditCode = document.getElementById('mJrnCredit').value;
            const amount = parseFloat(document.getElementById('mJrnAmount').value) || 0;
            const date = new Date().toISOString().split('T')[0];

            postDoubleEntry(date, desc, debitCode, creditCode, amount);

            closeModal();
            renderPage(currentPage);
        }

        function handleCreateAccount(e) {
            e.preventDefault();
            const code = document.getElementById('mAccCode').value;
            const type = document.getElementById('mAccType').value;
            const name = document.getElementById('mAccName').value;
            const category = document.getElementById('mAccCat').value;

            appState.accounts.push({ code, name, type, category, balance: 0 });
            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleCreateUser(e) {
            e.preventDefault();
            const name = document.getElementById('mUserName').value;
            const email = document.getElementById('mUserEmail').value;
            const role = document.getElementById('mUserRole').value;

            appState.users.push({ name, email, role, status: 'Active' });
            saveState();
            closeModal();
            renderPage(currentPage);
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            appState.settings.companyName = document.getElementById('cfgCompany').value;
            appState.settings.taxNumber = document.getElementById('cfgTaxNum').value;
            appState.settings.currency = document.getElementById('cfgCurr').value;
            appState.settings.taxRate = parseFloat(document.getElementById('cfgTaxRate').value) || 0;
            appState.settings.address = document.getElementById('cfgAddress').value;

            saveState();
            alert("Configurations saved!");
            renderPage('settings');
        }

        // Initialize App View
        window.addEventListener('DOMContentLoaded', () => {
            navigateTo('dashboard');
        });
    </script>
</body>
</html>
